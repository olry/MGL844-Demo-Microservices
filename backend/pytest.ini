[pytest]
asyncio_mode = auto
testpaths = tests
# Chaque service a son propre package (hello_app, notif_app) pour qu'on
# puisse les importer en meme temps dans les tests sans collision.
pythonpath = services/hello-service services/notification-service
addopts = --cov=hello_app --cov=notif_app --cov-report=term-missing
