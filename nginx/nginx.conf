# ============================================================================
#  NGINX : la porte d'entree (reverse proxy / edge) de la demo MGL844.
#  C'est le SEUL conteneur expose vers l'exterieur. Il assure cinq roles :
#    1. Load balancing  : repartit /api/ sur les 3 instances de la gateway.
#    2. Frontend statique : sert directement les fichiers HTML/CSS/JS.
#    3. TLS (HTTPS)     : termine le chiffrement au bord (certificat auto-signe).
#    4. Rate limiting   : limite le debit sur les routes d'authentification.
#    5. Proxy interne   : parle a la gateway en HTTP simple dans le reseau Docker.
# ============================================================================

events {}

http {
    # ------------------------------------------------------------------------
    #  Format de log enrichi : on ajoute l'instance choisie ($upstream_addr)
    #  pour VOIR le load balancing alterner entre les 3 gateways dans les logs.
    # ------------------------------------------------------------------------
    log_format lb '$remote_addr [gateway $upstream_addr] "$request" $status';
    access_log /var/log/nginx/access.log lb;

    # ------------------------------------------------------------------------
    #  4. RATE LIMITING : zone "auth" = 5 requetes/seconde par adresse IP.
    #     On l'applique plus bas, uniquement sur les routes /api/auth/.
    #     10m = taille memoire qui stocke l'etat des compteurs par IP.
    # ------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Par defaut, nginx renvoie 503 quand la limite est depassee. On preferere
    # le code standard 429 (Too Many Requests), plus explicite pour le client.
    limit_req_status 429;

    # ------------------------------------------------------------------------
    #  1. LOAD BALANCING : le groupe "gateway_pool" pointe sur le nom de
    #     service Docker "gateway". Comme il tourne en 3 replicas, le DNS
    #     interne de Docker renvoie 3 adresses et nginx les utilise a tour
    #     de role (round-robin, l'algorithme par defaut).
    # ------------------------------------------------------------------------
    upstream gateway_pool {
        server gateway:8000;
    }

    # ========================================================================
    #  Serveur HTTP (port 80) : on redirige tout vers HTTPS.
    #  Exception : /healthz reste en clair pour le healthcheck Docker.
    # ========================================================================
    server {
        listen 80;

        # Point de sante interne (utilise par le healthcheck du conteneur).
        location = /healthz {
            return 200 "ok\n";
        }

        # Tout le reste du trafic HTTP est redirige vers HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================================
    #  Serveur HTTPS (port 443) : c'est ici que tout se passe.
    # ========================================================================
    server {
        listen 443 ssl;
        server_name localhost;

        # --- 3. TLS : certificat auto-signe (voir scripts/gen-certs). --------
        #     Le chiffrement s'arrete ICI. En interne, nginx parle a la
        #     gateway en HTTP simple (TLS termination).
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # --- 2. FRONTEND STATIQUE -------------------------------------------
        #     nginx sert directement les fichiers du dossier monte. try_files
        #     renvoie index.html si le chemin n'existe pas (pratique pour une
        #     application monopage).
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # --- 4. RATE LIMITING sur l'authentification ------------------------
        #     Au-dela de 5 req/s (avec une petite file "burst" de 5), nginx
        #     repond 429 Too Many Requests SANS meme appeler la gateway.
        #     Cible : freiner le brute-force sur la connexion.
        #     Le slash final apres gateway_pool remplace /api/ par /, donc
        #     /api/auth/login arrive a la gateway comme /auth/login.
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://gateway_pool/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 1. + 5. API load-balancee --------------------------------------
        #     Tout le reste de /api/ est proxifie vers le pool de gateways.
        #     Le slash final retire le prefixe /api : /api/hello/users arrive
        #     a la gateway comme /hello/users (le format /{service}/{path}
        #     qu'elle attend deja). Rien a changer dans le code de la gateway.
        location /api/ {
            proxy_pass http://gateway_pool/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
